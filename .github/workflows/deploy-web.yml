name: Deploy Web to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
  STORE_PATH: ""
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  PRODUCTION_URL: "https://eclipso-web.vercel.app/"

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Deployment
        id: create_deployment
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments \
            -d '{"ref":"'"${{ github.sha }}"'","environment":"web-production","auto_merge":false,"required_contexts":[]}')

          http_status=$(echo "$response" | tr -d '\r' | sed -n 's/.*HTTP_STATUS:\([0-9]*\)$/\1/p')

          if [ "$http_status" != "201" ]; then
            echo "⚠️ Deployment creation failed with status $http_status (continuing anyway)"
            echo "deployment_id=0" >> $GITHUB_OUTPUT
          else
            deployment_id=$(echo "$response" | sed '$d' | jq -r '.id')
            echo "deployment_id=$deployment_id" >> $GITHUB_OUTPUT
            echo "✅ Created deployment ID: $deployment_id"
          fi

      - name: Update Deployment Status to In Progress
        if: steps.create_deployment.outputs.deployment_id != '0'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -d '{"state":"in_progress","environment":"web-production","environment_url":"${{ env.PRODUCTION_URL }}"}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application with Turbo
        run: pnpm turbo run build --filter=web...

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          echo "url=${{ env.PRODUCTION_URL }}" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: ${{ env.PRODUCTION_URL }}"

      - name: Update GitHub Deployment Status - Success
        if: success() && steps.create_deployment.outputs.deployment_id != '0'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -d '{"state":"success","environment":"web-production","environment_url":"${{ env.PRODUCTION_URL }}","description":"Web deployed to Vercel"}'
          echo "✅ Updated GitHub deployment status to success"

      - name: Update GitHub Deployment Status - Failure
        if: failure() && steps.create_deployment.outputs.deployment_id != '0'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -d '{"state":"failure","environment":"web-production","environment_url":"${{ env.PRODUCTION_URL }}","description":"Deployment failed - check logs"}'
          echo "❌ Updated GitHub deployment status to failure"

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** Eclipso Web" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ env.PRODUCTION_URL }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs for details."
          exit 1
